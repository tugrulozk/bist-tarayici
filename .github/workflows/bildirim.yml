name: BIST bildirim

on:
  schedule:
    - cron: "50 6 * * 1-5"    # TR 09:50 sabah dongusu (14:00'e kadar, her 5 dk tarar)
    - cron: "55 10 * * 1-5"   # TR 13:55 ogleden sonra dongusu (18:10'a kadar)
    - cron: "40 15 * * 1-5"   # TR 18:40 gun sonu raporu
  workflow_dispatch:
    inputs:
      mod:
        description: "Çalışma modu"
        type: choice
        default: bildirim
        options:
          - baglanti
          - deneme
          - bildirim
          - rapor
          - dongu

# Zamanlanmis calismalar birbirini beklesin (ust uste binmesin); elle baslatilanlar beklemesin
concurrency:
  group: ${{ github.event_name == 'schedule' && 'bist-tarama' || format('bist-elle-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kütüphaneleri kur
        run: pip install yfinance pandas numpy
      - name: Önceki bildirim kaydını getir
        uses: actions/cache@v4
        with:
          path: durum
          key: bildirilen-${{ github.run_id }}
          restore-keys: |
            bildirilen-
      - name: Tara ve bildir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOD: ${{ github.event.inputs.mod || (github.event.schedule == '40 15 * * 1-5' && 'rapor') || 'dongu' }}
          DONGU_ARA: "5"
          DONGU_BITIS: ${{ (github.event.schedule == '50 6 * * 1-5' && '14:00') || '18:10' }}
        run: python bildirim.py
